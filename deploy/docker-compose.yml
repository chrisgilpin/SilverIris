services:
  signal:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../services/signal:/app
    command: sh -c "npm install --omit=dev && node src/server.js"
    environment:
      PORT: "18787"
      HOST: "0.0.0.0"
    ports:
      - "18787:18787"
  caddy:
    image: caddy:2-alpine
    volumes:
      - ../services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8080:80"
    depends_on:
      - signal
