# SilverIris coturn. Live box: /etc/turnserver.conf (adds static-auth-secret).
# STUN is on. TURN allocate requires REST long-term creds minted by signal.
# No anonymous / no-auth. Do not set no-stun.

listening-port=3478
tls-listening-port=5349
external-ip=49.12.213.190
relay-ip=49.12.213.190
min-port=49152
max-port=49200
fingerprint
lt-cred-mech
use-auth-secret
# static-auth-secret is injected on the box from /etc/silveriris/turn.env — never commit it.
realm=007.goodhouseinc.com
server-name=007.goodhouseinc.com
no-multicast-peers
no-cli
no-rfc5780
no-stun-backward-compatibility
no-tlsv1
no-tlsv1_1
cert=/etc/silveriris/certs/fullchain.pem
pkey=/etc/silveriris/certs/privkey.pem
syslog
simple-log
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
