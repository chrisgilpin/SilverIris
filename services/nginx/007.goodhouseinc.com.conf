# Template only. Live TLS vhost is /etc/nginx/sites-available/007.goodhouseinc.com
# (Certbot-managed). Do not symlink this file into sites-enabled after certbot.
#
# First-time setup:
#   sudo cp services/nginx/007.goodhouseinc.com.conf /etc/nginx/sites-available/007.goodhouseinc.com
#   sudo ln -sfn /etc/nginx/sites-available/007.goodhouseinc.com /etc/nginx/sites-enabled/007.goodhouseinc.com
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 007.goodhouseinc.com

server {
    listen 80;
    listen [::]:80;
    server_name 007.goodhouseinc.com;

    location /ws {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
