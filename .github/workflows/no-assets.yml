name: no-assets

on:
  push:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Self-test
        run: python3 tools/guard/no_assets.py --self-test
      - name: Scan tree
        run: python3 tools/guard/no_assets.py
