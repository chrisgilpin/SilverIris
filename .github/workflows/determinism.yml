name: determinism

on:
  push:
  pull_request:

# Public job: no ROM. Records/replays a synthetic TAPE1 and RNG goldens.
# Private native-vs-wasm-vs-m32 against a retail pack is not in this workflow.

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: RNG golden vectors
        run: make -C native rng-test
      - name: TAPE1 record + replay
        run: make -C native tape-test
      - name: replay CLI on synthetic tape
        run: make -C native replay-synth
      - name: 2P corridor tape (walk, door, guard, PvP)
        run: make -C native 2p-corridor-test
      - name: private pack replay hook (synth tape, no ROM)
        run: make -C native replay-pack
      - name: netplay defaults on
        run: grep -q 'netplay: true' web/shell/src/flags.ts
